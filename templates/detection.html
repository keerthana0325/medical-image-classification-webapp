{% extends "layout.html" %}

{% block body %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2 class="text-center mb-4">Disease Detection</h2>
            <form method="POST" enctype="multipart/form-data">
                <div class="mb-3">
                    <label for="disease" class="form-label">Select Disease</label>
                    <select class="form-select" id="disease" name="disease" required>
                        <option value="" disabled selected>Select a disease</option>
                        <!--<option value="pneumonia">Pneumonia</option>-->
                        <option value="kidney_stones">Kidney Stones</option>
                        <!-- Add more diseases as needed -->
                    </select>
                </div>

                <div class="mb-3">
                    <label for="file" class="form-label">Upload an Image</label>
                    <input type="file" class="form-control" id="file" name="file" accept="image/*" required>
                </div>

                <button type="submit" class="btn btn-primary w-100">Submit</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
